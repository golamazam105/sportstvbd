name: Auto Update IPTV Playlist

on:
  schedule:
    # প্রতি ২ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে চলবে (UTC Time অনুযায়ী)
    - cron: '0 */2 * * *'
  workflow_dispatch: # এর মাধ্যমে আপনি যেকোনো সময় ম্যানুয়ালি রান করতে পারবেন

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests aiohttp

    - name: Run IPTV Scraper
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        # M3U এবং JSON দুটি ফাইলকেই ট্র্যাক করা হচ্ছে
        git add live_tv.m3u channels.json
        git commit -m "Auto-updated playlist and JSON [skip ci]" || exit 0
        git push
