name: Auto Update IPTV Playlist

on:
  schedule:
    # প্রতি ১ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে চলবে (UTC Time)
    - cron: '0 */1 * * *'
  workflow_dispatch: # এর মাধ্যমে আপনি চাইলে যেকোনো সময় ম্যানুয়ালি রান করতে পারবেন

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-node-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests

    - name: Run IPTV Scraper
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add live_tv.m3u
        git commit -m "Auto-updated playlist [skip ci]" || exit 0
        git push
