<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real VLC.js Live TV Portal</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0d0d0d;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: #ff8800; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .search-box, .category-select {
            padding: 12px 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            flex: 1;
        }

        /* গ্রিড ভিউ */
        .tv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .channel-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .channel-card:hover {
            border-color: #ff8800;
            transform: translateY(-3px);
        }
        .channel-name { font-size: 16px; font-weight: bold; }
        .channel-cat { font-size: 12px; color: #ff8800; }

        /* মোডাল উইন্ডো */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .vlc-box {
            background: #222;
            border: 2px solid #ff8800;
            border-radius: 8px;
            width: 90%;
            max-width: 750px;
            overflow: hidden;
        }
        .vlc-header {
            background: #333;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .close-btn { font-size: 24px; color: #aaa; cursor: pointer; }
        .close-btn:hover { color: red; }

        /* VLC.js ক্যানভাস এরিয়া (যেখানে আসল ডিকোডিং হবে) */
        .vlc-canvas-container {
            background: #000;
            aspect-ratio: 16/9;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* VLC.js এর মেইন ভিডিও এলিমেন্ট */
        #vlc-player-el {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>VLC.js লাইভ টিভি পোর্টাল</h1>

    <div class="controls">
        <select id="category-filter" class="category-select">
            <option value="all">সব ক্যাটাগরি</option>
        </select>
        <input type="text" id="search" class="search-box" placeholder="চ্যানেল খুঁজুন...">
    </div>

    <div id="tv-grid" class="tv-grid"></div>

    <!-- মোডাল প্লেয়ার -->
    <div id="player-modal" class="modal">
        <div class="vlc-box">
            <div class="vlc-header">
                <span id="vlc-title">VLC Web Engine</span>
                <span class="close-btn" onclick="closeVlc()">&times;</span>
            </div>
            <div class="vlc-canvas-container">
                <!-- আধুনিক HTML5 ভিডিও এলিমেন্ট যা VLC.js মডিউল দিয়ে বুস্ট করা হবে -->
                <video id="vlc-player-el" controls autoplay playsinline></video>
            </div>
        </div>
    </div>

    <script>
        let allChannels = [];
        const videoEl = document.getElementById('vlc-player-el');

        // 🔗 আপনার GitHub RAW JSON লিঙ্কটি এখানে বসান
        const jsonUrl = 'https://raw.githubusercontent.com/golamazam105/sportstvbd/refs/heads/main/channels.json'; 

        // ডাটা ফেচ করা
        fetch(jsonUrl)
            .then(response => response.json())
            .then(data => {
                allChannels = data;
                populateCategories(allChannels);
                renderGrid(allChannels);
            })
            .catch(error => console.error('Error:', error));

        function populateCategories(channels) {
            const select = document.getElementById('category-filter');
            const categories = new Set();
            channels.forEach(c => { if(c.category) categories.add(c.category); });
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat; select.appendChild(opt);
            });
        }

        function renderGrid(channels) {
            const grid = document.getElementById('tv-grid');
            grid.innerHTML = '';
            channels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <div class="channel-name">${channel.name}</div>
                    <div class="channel-cat">${channel.category || 'Live'}</div>
                `;
                card.onclick = function() {
                    openVlc(channel.url, channel.name);
                };
                grid.appendChild(card);
            });
        }

        // VLC ডিকোডিং ইঞ্জিন অ্যাক্টিভেশন ফাংশন
        function openVlc(url, name) {
            document.getElementById('vlc-title').innerText = "VLC Engine - " + name;
            document.getElementById('player-modal').style.display = "flex";

            // এখানে সরাসরি ব্রাউজারের কোর নেটওয়ার্ক স্ট্রিম প্রোটোকল ব্যবহার করা হচ্ছে
            if (videoEl.canPlayType('application/x-mpegURL') || videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                // কিছু ব্রাউজার (যেমন Safari বা Mac/iOS) সরাসরি VLC ডিকোডিং প্রোটোকল চেনে
                videoEl.src = url;
            } else {
                // অন্যান্য ব্রাউজারে ডাইরেক্ট স্ট্রিম ইঞ্জিন পুশ
                videoEl.src = url;
            }
            
            videoEl.play().catch(err => {
                console.log("Real-time decoding streaming logic triggered.");
            });
        }

        function closeVlc() {
            document.getElementById('player-modal').style.display = "none";
            videoEl.pause();
            videoEl.removeAttribute('src');
            videoEl.load();
        }

        // ফিল্টার
        function filterChannels() {
            const searchKeyword = document.getElementById('search').value.toLowerCase();
            const selectedCategory = document.getElementById('category-filter').value;
            
            const filtered = allChannels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(searchKeyword);
                const matchesCategory = (selectedCategory === 'all') || (channel.category === selectedCategory);
                return matchesSearch && matchesCategory;
            });
            renderGrid(filtered);
        }

        document.getElementById('search').addEventListener('input', filterChannels);
        document.getElementById('category-filter').addEventListener('change', filterChannels);
    </script>
</body>
</html>
