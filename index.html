<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Portal - Stay on Site</title>
    
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f0f12;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: #00ff88; margin-bottom: 30px; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .search-box, .category-select {
            padding: 12px 20px;
            background: #1a1a24;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            flex: 1;
        }

        /* গ্রিড ভিউ */
        .tv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .channel-card {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100px;
        }
        .channel-card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.2);
        }
        .channel-name { font-size: 16px; font-weight: bold; color: #fff; }
        .channel-cat {
            font-size: 12px; color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            padding: 4px 8px; border-radius: 20px; align-self: center;
        }

        /* ইন-সাইট মোডাল প্লেয়ার */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a24;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 750px;
            text-align: center;
            border: 1px solid #333;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 20px;
            font-size: 30px; color: #aaa; cursor: pointer;
            z-index: 10;
        }
        .close-btn:hover { color: white; }
        
        #web-player-wrapper {
            margin-top: 15px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }
        .video-js { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

    <h1>লাইভ টিভি পোর্টাল</h1>

    <div class="controls">
        <select id="category-filter" class="category-select">
            <option value="all">সব ক্যাটাগরি</option>
        </select>
        <input type="text" id="search" class="search-box" placeholder="চ্যানেলের নাম টাইপ করুন...">
    </div>

    <div id="tv-grid" class="tv-grid"></div>

    <div id="player-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-channel-name" style="margin: 0 0 10px 0; color: #00ff88;">চ্যানেলের নাম</h3>
            
            <div id="web-player-wrapper">
                <video id="tv-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
                    <p class="vjs-no-js">JavaScript Required</p>
                </video>
            </div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>

    <script>
        let player;
        let allChannels = [];

        window.onload = function() {
            player = videojs('tv-player');
        };

        // 🔗 আপনার GitHub RAW JSON লিঙ্কটি এখানে বসান
        const jsonUrl = 'https://raw.githubusercontent.com/golamazam105/sportstvbd/refs/heads/main/channels.json'; 

        fetch(jsonUrl)
            .then(response => response.json())
            .then(data => {
                allChannels = data;
                populateCategories(allChannels);
                renderGrid(allChannels);
            })
            .catch(error => console.error('Error:', error));

        function populateCategories(channels) {
            const select = document.getElementById('category-filter');
            const categories = new Set();
            channels.forEach(c => { if(c.category) categories.add(c.category); });
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat; select.appendChild(opt);
            });
        }

        function renderGrid(channels) {
            const grid = document.getElementById('tv-grid');
            grid.innerHTML = '';
            
            channels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <div class="channel-name">${channel.name}</div>
                    <div class="channel-cat">${channel.category || 'Live'}</div>
                `;
                
                card.onclick = function() {
                    openPlayer(channel.url, channel.name);
                };
                grid.appendChild(card);
            });
        }

        // 💡 এই ফাংশনটি দিয়ে ভিডিওটি সাইটের ভেতরেই প্লে করা হচ্ছে
        function openPlayer(url, name) {
            document.getElementById('modal-channel-name').innerText = name;
            document.getElementById('player-modal').style.display = "flex";

            // ⚡ CORS Bypass Proxy (ভিডিও লিঙ্ক ব্রাউজারে খোলার ট্রিক)
            // যদি কোনো লিঙ্ক প্লে না হয়, তবে নিচের লাইনের শুরুতে থাকা '//' কেটে দিতে পারেন
            // let proxyUrl = "https://cors-anywhere.herokuapp.com/" + url;
            
            player.src({
                src: url, // প্রক্সি ব্যবহার করতে চাইলে এখানে 'proxyUrl' বসাবেন
                type: 'application/x-mpegURL'
            });
            
            player.play().catch(e => {
                console.log("Playback error: ", e);
            });
        }

        function closeModal() {
            document.getElementById('player-modal').style.display = "none";
            player.pause();
            player.reset(); // প্লেয়ার মেমোরি ক্লিয়ার করা
        }

        // ফিল্টারিং
        function filterChannels() {
            const searchKeyword = document.getElementById('search').value.toLowerCase();
            const selectedCategory = document.getElementById('category-filter').value;
            
            const filtered = allChannels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(searchKeyword);
                const matchesCategory = (selectedCategory === 'all') || (channel.category === selectedCategory);
                return matchesSearch && matchesCategory;
            });
            renderGrid(filtered);
        }

        document.getElementById('search').addEventListener('input', filterChannels);
        document.getElementById('category-filter').addEventListener('change', filterChannels);
    </script>
</body>
</html>
