<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Live TV Portal</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f0f12;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: #00ff88; margin-bottom: 30px; }

        /* সার্চ ও ফিল্টার এরিয়া */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .search-box, .category-select {
            padding: 12px 20px;
            background: #1a1a24;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            flex: 1;
        }

        /* 🔳 গ্রিড ভিউ ডিজাইন (Grid View) */
        .tv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .channel-card {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100px;
        }
        .channel-card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.2);
        }
        .channel-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }
        .channel-cat {
            font-size: 12px;
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            padding: 4px 8px;
            border-radius: 20px;
            align-self: center;
        }

        /* 📑 পপ-আপ বা মোডাল (Modal) ডিজাইন */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a24;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 650px;
            text-align: center;
            border: 1px solid #333;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 30px; color: #aaa; cursor: pointer;
        }
        .close-btn:hover { color: white; }
        
        /* মোডালের ভেতরের প্লেয়ার অপশন বাটন */
        .player-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-web { background: #00ff88; color: black; }
        .btn-vlc { background: #ff8800; color: white; }
        .btn-mx { background: #0084ff; color: white; }
        .btn:hover { opacity: 0.9; transform: scale(1.05); }

        /* ওয়েব প্লেয়ার কন্টেইনার (শুরুতে লুকানো থাকবে) */
        #web-player-wrapper {
            display: none;
            margin-bottom: 20px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-js { width: 100% !important; height: 360px !important; }
    </style>
</head>
<body>

    <h1>লাইভ টিভি পোর্টাল</h1>

    <!-- কন্ট্রোল সেকশন -->
    <div class="controls">
        <select id="category-filter" class="category-select">
            <option value="all">সব ক্যাটাগরি</option>
        </select>
        <input type="text" id="search" class="search-box" placeholder="চ্যানেলের নাম টাইপ করুন...">
    </div>

    <!-- চ্যানেল গ্রিড -->
    <div id="tv-grid" class="tv-grid"></div>

    <!-- প্লেয়ার মোডাল (Popup) -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-channel-name">চ্যানেলের নাম</h3>
            
            <!-- সরাসরি ওয়েবসাইট প্লেয়ার -->
            <div id="web-player-wrapper">
                <video id="tv-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
                    <p class="vjs-no-js">JavaScript required</p>
                </video>
            </div>

            <p>কোথায় প্লে করতে চান সিলেক্ট করুন:</p>
            <div class="player-options">
                <button class="btn btn-web" onclick="startWebPlayer()">🌐 ব্রাউজার প্লেয়ার</button>
                <a id="vlc-link" class="btn btn-vlc" href="#">🧡 VLC Player-এ দেখুন</a>
                <a id="mx-link" class="btn btn-mx" href="#">💙 MX Player (Android)</a>
            </div>
        </div>
    </div>

    <!-- Video.js Script -->
    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>

    <script>
        let player;
        let allChannels = [];
        let currentUrl = "";

        // 🔗 আপনার GitHub RAW JSON লিঙ্কটি এখানে বসান
        const jsonUrl = 'https://raw.githubusercontent.com/golamazam105/sportstvbd/refs/heads/main/channels.json'; 

        // পৃষ্ঠা লোড হলে প্লেয়ার রেডি করা
        window.onload = function() {
            player = videojs('tv-player');
        };

        // ডাটা ফেচ করা
        fetch(jsonUrl)
            .then(response => response.json())
            .then(data => {
                allChannels = data;
                populateCategories(allChannels);
                renderGrid(allChannels);
            })
            .catch(error => console.error('Error:', error));

        function populateCategories(channels) {
            const select = document.getElementById('category-filter');
            const categories = new Set();
            channels.forEach(c => { if(c.category) categories.add(c.category); });
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat; select.appendChild(opt);
            });
        }

        // গ্রিড ভিউ রেন্ডার করা
        function renderGrid(channels) {
            const grid = document.getElementById('tv-grid');
            grid.innerHTML = '';
            
            channels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <div class="channel-name">${channel.name}</div>
                    <div class="channel-cat">${channel.category || 'Live'}</div>
                `;
                
                card.onclick = function() {
                    openPlayerOption(channel.url, channel.name);
                };
                grid.appendChild(card);
            });
        }

        // কার্ডে ক্লিক করলে মোডাল ওপেন হবে
        function openPlayerOption(url, name) {
            currentUrl = url;
            document.getElementById('modal-channel-name').innerText = name;
            
            // 💡 ম্যাজিক লিঙ্ক: এই ফরম্যাটগুলো মোবাইল/পিসির অ্যাপ ওপেন করতে বাধ্য করে
            document.getElementById('vlc-link').href = `vlc://${url}`;
            document.getElementById('mx-link').href = `intent:${url}#Intent;package=com.mxtech.videoplayer.ad;end`;

            // ওয়েব প্লেয়ার প্যানেল রিসেট করা
            document.getElementById('web-player-wrapper').style.display = "none";
            player.pause();

            document.getElementById('player-modal').style.display = "flex";
        }

        // ইউজার যদি ব্রাউজারেই দেখতে চায়
        function startWebPlayer() {
            document.getElementById('web-player-wrapper').style.display = "block";
            player.src({ src: currentUrl, type: 'application/x-mpegURL' });
            player.play().catch(e => {
                alert("দুঃখিত! এই লিঙ্কটি ব্রাউজারে সাপোর্ট করছে না। দয়া করে VLC Player অপশনটি ব্যবহার করুন।");
            });
        }

        function closeModal() {
            document.getElementById('player-modal').style.display = "none";
            player.pause();
        }

        // ফিল্টারিং
        function filterChannels() {
            const searchKeyword = document.getElementById('search').value.toLowerCase();
            const selectedCategory = document.getElementById('category-filter').value;
            
            const filtered = allChannels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(searchKeyword);
                const matchesCategory = (selectedCategory === 'all') || (channel.category === selectedCategory);
                return matchesSearch && matchesCategory;
            });
            renderGrid(filtered);
        }

        document.getElementById('search').addEventListener('input', filterChannels);
        document.getElementById('category-filter').addEventListener('change', filterChannels);
    </script>
</body>
</html>
