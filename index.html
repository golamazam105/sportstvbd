<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLC Web Live TV Portal</title>
    
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0c0c0e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: #ff8800; margin-bottom: 30px; text-shadow: 0 0 10px rgba(255,136,0,0.3); }

        /* কন্ট্রোল বাটন ও সার্চ */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .search-box, .category-select {
            padding: 12px 20px;
            background: #16161e;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            flex: 1;
        }

        /* 🔳 গ্রিড ভিউ ডিজাইন */
        .tv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .channel-card {
            background: #16161e;
            border: 1px solid #252530;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .channel-card:hover {
            transform: translateY(-5px);
            border-color: #ff8800; /* VLC Orange */
            box-shadow: 0 8px 20px rgba(255, 136, 0, 0.2);
        }
        .channel-name { font-size: 16px; font-weight: bold; color: #fff; }
        .channel-cat {
            font-size: 12px; color: #ff8800;
            background: rgba(255, 136, 0, 0.1);
            padding: 4px 8px; border-radius: 20px; align-self: center;
        }

        /* 🧡 কাস্টম VLC মোডাল প্লেয়ার উইন্ডো */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .vlc-window {
            background: #2b2b2b; /* VLC ক্লাসিক গ্রে কালার */
            border: 2px solid #555;
            border-radius: 6px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        
        /* VLC টপ বার */
        .vlc-header {
            background: linear-gradient(to bottom, #3c3c3c, #2a2a2a);
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
            font-size: 14px;
            font-weight: bold;
            color: #ddd;
        }
        .vlc-logo-text { display: flex; align-items: center; gap: 8px; }
        .vlc-cone { width: 16px; height: 16px; background: #ff8800; clip-path: polygon(20% 100%, 80% 100%, 60% 0%, 40% 0%); }
        .vlc-close { font-size: 20px; color: #bbb; cursor: pointer; line-height: 1; }
        .vlc-close:hover { color: #ff3333; }

        /* ভিডিও স্ক্রিন এরিয়া */
        .vlc-screen {
            background: #000;
            aspect-ratio: 16/9;
            width: 100%;
        }
        .video-js { width: 100% !important; height: 100% !important; }

        /* VLC এর আসল অরেঞ্জ থিম ওভাররাইড */
        .video-js .vjs-play-progress, .video-js .vjs-volume-level { background-color: #ff8800 !important; }
        .video-js .vjs-big-play-button { background-color: rgba(255, 136, 0, 0.8) !important; border-color: #ff8800 !important; }

        /* VLC বটম স্ট্যাটাস বার */
        .vlc-footer {
            background: #252525;
            padding: 6px 12px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #333;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>VLC ওয়েব লাইভ টিভি পোর্টাল</h1>

    <div class="controls">
        <select id="category-filter" class="category-select">
            <option value="all">সব ক্যাটাগরি</option>
        </select>
        <input type="text" id="search" class="search-box" placeholder="চ্যানেল খুঁজুন...">
    </div>

    <div id="tv-grid" class="tv-grid"></div>

    <div id="player-modal" class="modal">
        <div class="vlc-window">
            <div class="vlc-header">
                <div class="vlc-logo-text">
                    <div class="vlc-cone"></div>
                    <span id="vlc-title">VLC Media Player - Live Stream</span>
                </div>
                <span class="vlc-close" onclick="closeVlc()">&times;</span>
            </div>
            
            <div class="vlc-screen">
                <video id="vlc-video-core" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
                    <p class="vjs-no-js">JavaScript Required</p>
                </video>
            </div>

            <div class="vlc-footer">
                🟢 Streaming Status: <span id="vlc-status" style="color: #00ff88;">Buffering...</span>
            </div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>

    <script>
        let vlcPlayer;
        let allChannels = [];

        window.onload = function() {
            // প্লেয়ার ইনিশিয়ালাইজ করা এবং রেন্ডারিং স্পিড বাড়ানোর অপশন দেওয়া
            vlcPlayer = videojs('vlc-video-core', {
                html5: {
                    vhs: { overrideNative: true },
                    nativeAudioTracks: false,
                    nativeVideoTracks: false
                }
            });
        };

        // 🔗 আপনার GitHub RAW JSON লিঙ্কটি এখানে বসান
        const jsonUrl = 'https://raw.githubusercontent.com/golamazam105/sportstvbd/refs/heads/main/channels.json'; 

        fetch(jsonUrl)
            .then(response => response.json())
            .then(data => {
                allChannels = data;
                populateCategories(allChannels);
                renderGrid(allChannels);
            })
            .catch(error => console.error('Error:', error));

        function populateCategories(channels) {
            const select = document.getElementById('category-filter');
            const categories = new Set();
            channels.forEach(c => { if(c.category) categories.add(c.category); });
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat; select.appendChild(opt);
            });
        }

        function renderGrid(channels) {
            const grid = document.getElementById('tv-grid');
            grid.innerHTML = '';
            channels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <div class="channel-name">${channel.name}</div>
                    <div class="channel-cat">${channel.category || 'Live'}</div>
                `;
                card.onclick = function() {
                    openVlcPlayer(channel.url, channel.name);
                };
                grid.appendChild(card);
            });
        }

        // VLC প্লেয়ার ওপেন করার মেইন ফাংশন
        function openVlcPlayer(url, name) {
            document.getElementById('vlc-title').innerText = "VLC Media Player - " + name;
            document.getElementById('player-modal').style.display = "flex";
            document.getElementById('vlc-status').innerText = "Connecting to stream...";
            document.getElementById('vlc-status').style.color = "#ff8800";

            // ডাইরেক্ট HLS লোডিং মেকানিজম (VLC ডিকোডার ইঞ্জিন ফ্রেন্ডলি)
            vlcPlayer.src({
                src: url,
                type: 'application/x-mpegURL'
            });
            
            vlcPlayer.play().then(() => {
                document.getElementById('vlc-status').innerText = "Playing (Live)";
                document.getElementById('vlc-status').style.color = "#00ff88";
            }).catch(e => {
                document.getElementById('vlc-status').innerText = "Playback failed. Checking CORS or Link validity.";
                document.getElementById('vlc-status').style.color = "#ff3333";
            });
        }

        function closeVlc() {
            document.getElementById('player-modal').style.display = "none";
            vlcPlayer.pause();
            vlcPlayer.reset();
        }

        // ফিল্টারিং লজিক
        function filterChannels() {
            const searchKeyword = document.getElementById('search').value.toLowerCase();
            const selectedCategory = document.getElementById('category-filter').value;
            
            const filtered = allChannels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(searchKeyword);
                const matchesCategory = (selectedCategory === 'all') || (channel.category === selectedCategory);
                return matchesSearch && matchesCategory;
            });
            renderGrid(filtered);
        }

        document.getElementById('search').addEventListener('input', filterChannels);
        document.getElementById('category-filter').addEventListener('change', filterChannels);
    </script>
</body>
</html>
