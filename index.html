<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাইভ টিভি প্লেয়ার — Vercel</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #00adb5; }
        .player-wrapper { position: relative; width: 100%; max-width: 800px; margin: 0 auto 30px auto; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-js { width: 100%; aspect-ratio: 16 / 9; }
        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; justify-content: center; }
        .channel-card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .channel-card:hover { background-color: #00adb5; transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0, 173, 181, 0.4); }
        .channel-icon { font-size: 35px; margin-bottom: 10px; }
        .channel-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .loading { text-align: center; font-size: 18px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>আমার লাইভ টিভি অ্যাপ</h1>

    <div class="player-wrapper">
        <video id="my-live-player" class="video-js vjs-theme-city" controls preload="auto" width="800"></video>
    </div>

    <div id="loading" class="loading">গিটহাব থেকে চ্যানেল লিস্ট লোড হচ্ছে...</div>
    <div class="channel-grid" id="channel-list"></div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.js"></script>

<script>
    const player = videojs('my-live-player', { fluid: true, autoplay: false, controls: true });

    // আপনার তৈরি করা ক্লাউডফ্লেয়ার প্রক্সি লিঙ্ক
    const proxyUrl = "https://plain-silence-b434.azam-canvapro.workers.dev/?url=";

    // আপনার দেওয়া অরিজিনাল গিটহাব র লিঙ্ক
    const githubJsonUrl = "https://raw.githubusercontent.com/golamazam105/sportstvbd/refs/heads/main/channels.json"; 

    async function loadChannels() {
        try {
            // প্রক্সি দিয়ে গিটহাবের ডেটা ফেচ করা হচ্ছে
            const finalJsonFetchUrl = proxyUrl + encodeURIComponent(githubJsonUrl);
            const response = await fetch(finalJsonFetchUrl);
            const channelData = await response.json();
            
            document.getElementById('loading').style.display = 'none';
            const grid = document.getElementById('channel-list');

            // একটি সিঙ্গেল চ্যানেলের কার্ড তৈরি করা হচ্ছে
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.onclick = () => playChannel(channelData.url);
            card.innerHTML = `
                <div class="channel-icon">📺</div>
                <div class="channel-name" title="${channelData.name}">${channelData.name}</div>
            `;
            grid.appendChild(card);

            // অটোমেটিক প্রথম চ্যানেলটি প্লেয়ারে লোড করা হচ্ছে
            if(channelData.url) {
                playChannel(channelData.url);
            }

        } catch (error) {
            console.error("Error:", error);
            document.getElementById('loading').innerText = "চ্যানেল লিস্ট লোড করতে সমস্যা হয়েছে! প্রক্সি বা গিটহাব লিঙ্ক চেক করুন।";
        }
    }

    function playChannel(rawUrl) {
        // ক্লাউডফ্লেয়ার প্রক্সি দিয়ে m3u8 লিঙ্ক পাস করানো হচ্ছে
        const finalStreamUrl = proxyUrl + encodeURIComponent(rawUrl);

        player.src({
            src: finalStreamUrl,
            type: 'application/x-mpegURL'
        });

        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = loadChannels;
</script>

</body>
</html>
